name: Verify application and evidence

on:
  push:
    branches: [main, 'codex/fullstack-upgrade-*', 'codex/fix-streamlit-history-*', 'codex/publish-react-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen
      - name: Verify published model evaluation records
        run: uv run --frozen python tools/verify_evaluation.py
      - name: Run deterministic application tests without model credentials
        run: uv run --frozen pytest tests/delivery tests/platform -q
      - name: Verify upgrade catalog and saved evidence without API calls
        run: |
          uv run --frozen python scripts/evaluate_upgrade.py --catalog-only
          uv run --frozen python scripts/verify_upgrade_evidence.py
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Offline browser login layout (business tests require local sandbox credentials)
        run: npx playwright test --grep 'login is accessible'
      - name: Verify public React screenshots and historical metric labels
        env:
          E2E_PUBLIC_DEMO: '1'
          E2E_BASE_URL: http://127.0.0.1:18745
        run: |
          python3 -m http.server 18745 --bind 127.0.0.1 --directory ../docs > /tmp/aftersales-public-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid"' EXIT
          npx playwright test e2e/public-demo.spec.ts
