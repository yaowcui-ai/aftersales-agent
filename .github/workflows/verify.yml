name: Verify application and evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen
      - name: Verify published model evaluation records
        run: uv run --frozen python tools/verify_evaluation.py
      - name: Run deterministic application tests without model credentials
        run: uv run --frozen pytest tests/delivery -q
